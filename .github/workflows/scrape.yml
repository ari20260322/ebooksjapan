name: Ebooksjapan Scraper

on:
  repository_dispatch:
    types: [scrape_trigger]

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBJECT: ${{ github.event.client_payload.subject }}
          TARGET_URL: ${{ github.event.client_payload.url }}
        run: python scraper.py

      - name: Commit and push history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 生成されたすべての履歴ファイル（history_*.json）を追加
          git add history_*.json
          
          # 変更がある場合のみコミット
          if ! git diff --staged --quiet; then
            git commit -m "Update scraping history for ${{ github.event.client_payload.subject }}"
            
            # 【重要】複数の処理が同時に走った時の衝突を防ぐため、push前に最新状態をpullして統合する
            git pull --rebase origin main
            git push origin main
          else
            echo "No history changes to commit."
          fi
